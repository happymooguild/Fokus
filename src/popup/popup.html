<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fokus</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <!-- The 1A "Target" mark, same 128 grid as the shipped icons. -->
          <svg viewBox="16 16 96 96" width="32" height="32">
            <rect x="16" y="16" width="96" height="96" fill="#ec3013" />
            <circle cx="64" cy="64" r="30" fill="none" stroke="#fff" stroke-width="12" />
            <circle cx="64" cy="64" r="9" fill="#fff" />
          </svg>
        </span>
        <div class="brand-text">
          <h1>fokus</h1>
          <p id="summary" class="summary">&nbsp;</p>
        </div>
      </div>

      <button
        id="master"
        class="master"
        type="button"
        role="switch"
        aria-checked="true"
        title="Pause Fokus without losing your toggles"
      >
        <span class="master-label">on</span>
        <span class="master-track"><span class="master-knob"></span></span>
      </button>
    </header>

    <div class="searchbar">
      <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
        <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input id="filter" type="search" placeholder="Filter toggles…" autocomplete="off" spellcheck="false" />
    </div>

    <main id="list" class="list"></main>

    <p id="empty" class="empty" hidden>Nothing matches that.</p>

    <footer class="footer">
      <a id="sponsor" class="sponsor" href="#" target="_blank" rel="noopener noreferrer">
        <span class="heart" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="15" height="15">
            <path
              d="M12 20.5s-7.5-4.6-7.5-9.6A4.4 4.4 0 0 1 12 8.3a4.4 4.4 0 0 1 7.5 2.6c0 5-7.5 9.6-7.5 9.6Z"
              fill="currentColor"
            />
          </svg>
        </span>
        <span class="sponsor-text">
          <strong>Support me</strong>
          <small>Fokus is free and always will be</small>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </footer>

    <script src="../features.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
